schema_version: 1

context:
  version: "0.7.9"

package:
  name: r-pegboard
  version: ${{ version }}

source:
  url: https://github.com/carpentries/pegboard/archive/refs/tags/${{ version }}.tar.gz
  sha256: ee9c429e792817ea269b43c98bc95bcab62aaff41d30754377cd4d7e73539611

build:
  number: 2
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-r6
    - r-commonmark
    - r-fs >=1.5.0
    - r-glue
    - r-purrr
    - r-tinkr >=0.3.0
    - r-xml2
    - r-xslt
    - r-yaml
  run:
    - r-base
    - r-r6
    - r-commonmark
    - r-fs >=1.5.0
    - r-glue
    - r-purrr
    - r-tinkr >=0.3.0
    - r-xml2
    - r-xslt
    - r-yaml

tests:
  - r:
      libraries:
        - pegboard
  - files:
      source:
        - tests/
    requirements:
      run:
        - r-testthat
        - r-gert
        - r-dplyr
    script:
      - R -e "testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)"

about:
  license: MIT
  summary: Parse Source Files in The Carpentries Workbench
  description: |
    The Carpentries (<https://carpentries.org>) curricula is made of of lessons that are
    hosted as websites. Each lesson represents between a half day to two days of instruction
    and contains several episodes, which are written as 'kramdown'-flavored 'markdown'
    documents and converted to HTML using the 'Jekyll' static website generator. This
    package builds on top of the 'tinkr' package; reads in these markdown documents
    to 'XML' and stores them in R6 classes for convenient exploration and manipulation
    of sections within episodes.
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
  homepage: https://github.com/carpentries/pegboard
  repository: https://github.com/carpentries/pegboard
  documentation: https://carpentries.github.io/pegboard/

extra:
  recipe-maintainers:
    - conda-forge/r
    - matthewfeickert
